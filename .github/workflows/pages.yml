# ============================================================
# Deploy thư mục web/ lên GitHub Pages.
#
# LƯU Ý CHO OWNER — phải bật MỘT LẦN trong repo:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
# Sau đó workflow tự chạy khi có push lên nhánh main chạm web/**,
# hoặc chạy tay bằng tab Actions → Run workflow (workflow_dispatch).
# ============================================================
name: Deploy web lên GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cấu hình Pages
        uses: actions/configure-pages@v5

      - name: Đóng gói thư mục web/
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Triển khai lên Pages
        id: deployment
        uses: actions/deploy-pages@v4
