<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#111318">
<title>Muse Relay — Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
(function(){
  try{
    var t=localStorage.getItem("muse_relay_theme");
    var theme=t==="light"?"light":"dark";
    document.documentElement.dataset.theme=theme;
    document.documentElement.style.backgroundColor=theme==="light"?"#f4f6f9":"#111318";
  }catch(e){
    document.documentElement.dataset.theme="dark";
    document.documentElement.style.backgroundColor="#111318";
  }
  try{
    var l=localStorage.getItem("muse_relay_lang");
    var lang=l==="en"?"en":"vi";
    document.documentElement.lang=lang;
  }catch(e){
    document.documentElement.lang="vi";
  }
})();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
