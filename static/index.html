<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muse Relay — Chat</title>
<style>
  :root { --bg:#0f141a; --panel:#171e26; --line:#243040; --me:#2f6fed; --muse:#243244; --text:#e8eef5; --dim:#8b9bb0; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; }
  #side { width: 280px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  #side header { padding: 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; }
  #search { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 8px 10px; outline: none; }
  #addBtn { background: var(--me); border: none; color: #fff; border-radius: 8px; padding: 8px 11px; cursor: pointer; font-size: 15px; }
  #convList { flex: 1; overflow-y: auto; }
  .conv { padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; gap: 8px; align-items: center; }
  .conv:hover { background: #1d2632; }
  .conv.active { background: #22304a; }
  .conv .info { flex: 1; min-width: 0; }
  .conv .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv .prev { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .badge { background: var(--me); color: #fff; border-radius: 999px; font-size: 11px; padding: 2px 7px; flex-shrink: 0; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #main header { padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 70%; padding: 8px 12px; border-radius: 12px; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--me); }
  .msg.muse { align-self: flex-start; background: var(--muse); }
  .msg .t { display: block; font-size: 10px; color: rgba(255,255,255,.55); margin-top: 4px; }
  #composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  #input { flex: 1; background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 10px 12px; outline: none; resize: none; font: inherit; }
  #send { background: var(--me); border: none; color: #fff; border-radius: 10px; padding: 10px 18px; cursor: pointer; }
  #send:disabled { opacity: .5; cursor: default; }
  #empty { color: var(--dim); margin: auto; text-align: center; }
</style>
</head>
<body>
  <aside id="side">
    <header>
      <input id="search" placeholder="Tìm Muse…">
      <button id="addBtn" title="Thêm account Muse">＋</button>
    </header>
    <div id="convList"></div>
  </aside>
  <section id="main">
    <header id="chatTitle">Muse Relay</header>
    <div id="chat"><div id="empty">Chọn một hội thoại bên trái<br>(lần đầu: bấm ＋ để tạo account Muse)</div></div>
    <div id="composer">
      <textarea id="input" rows="1" placeholder="Nhập tin nhắn… (Enter gửi, Shift+Enter xuống dòng)"></textarea>
      <button id="send">Gửi</button>
    </div>
  </section>
<script>
const TOKEN = localStorage.getItem('relay_admin_token');
if (!TOKEN) {
  const t = prompt('Nhập admin token (xem data/admin_token.txt trên server):');
  if (!t) { document.body.textContent = 'Cần admin token.'; throw new Error('no token'); }
  localStorage.setItem('relay_admin_token', t.trim());
  location.reload();
}
const H = { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' };

let convs = [];
let active = null;
let cursor = {};
const $ = s => document.querySelector(s);

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: H });
  if (r.status === 401) { localStorage.removeItem('relay_admin_token'); location.reload(); return; }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status);
  return r.json();
}

function fmtTime(s) {
  return s ? new Date(s.replace(' ', 'T') + 'Z').toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) : '';
}

function scrollToBottom() { const el = $('#chat'); el.scrollTop = el.scrollHeight; }

async function loadConvs() {
  const data = await api('/api/conversations');
  if (!data) return;
  convs = data.conversations;
  const q = $('#search').value.trim().toLowerCase();
  const list = $('#convList');
  list.innerHTML = '';
  for (const c of convs) {
    if (q && !(c.muse_id + ' ' + c.name).toLowerCase().includes(q)) continue;
    const div = document.createElement('div');
    div.className = 'conv' + (c.id === active ? ' active' : '');
    const info = document.createElement('div'); info.className = 'info';
    const name = document.createElement('div'); name.className = 'name'; name.textContent = c.name;
    const prev = document.createElement('div'); prev.className = 'prev';
    prev.textContent = (c.preview_role === 'user' ? 'Bạn: ' : '') + (c.preview || '—');
    info.appendChild(name); info.appendChild(prev);
    div.appendChild(info);
    if (c.unread > 0) {
      const b = document.createElement('span'); b.className = 'badge'; b.textContent = c.unread;
      div.appendChild(b);
    }
    div.onclick = () => openConv(c.id);
    list.appendChild(div);
  }
}

function renderMsg(m) {
  const div = document.createElement('div');
  div.className = 'msg ' + m.role;
  div.textContent = m.text;
  const t = document.createElement('span'); t.className = 't'; t.textContent = fmtTime(m.created_at);
  div.appendChild(t);
  $('#chat').appendChild(div);
}

async function openConv(id) {
  active = id;
  const c = convs.find(x => x.id === id);
  $('#chatTitle').textContent = c ? `${c.name} (${c.muse_id})` : '';
  $('#chat').innerHTML = '';
  cursor[id] = 0;
  const data = await api(`/api/messages?conversation_id=${id}&after=0`);
  for (const m of data.messages) { cursor[id] = m.id; renderMsg(m); }
  scrollToBottom();
  api('/api/read', { method: 'POST', body: JSON.stringify({ conversation_id: id }) }).then(loadConvs);
}

async function pollActive() {
  if (active == null || cursor[active] == null) return;
  try {
    const data = await api(`/api/messages?conversation_id=${active}&after=${cursor[active]}`);
    let fresh = false;
    for (const m of data.messages) { cursor[active] = m.id; renderMsg(m); fresh = true; }
    if (fresh) {
      scrollToBottom();
      api('/api/read', { method: 'POST', body: JSON.stringify({ conversation_id: active }) });
    }
  } catch (e) { /* server chớp mắt thì bỏ qua chu kỳ này */ }
}

async function send() {
  const input = $('#input');
  const text = input.value.trim();
  if (!text || active == null) return;
  input.value = '';
  $('#send').disabled = true;
  try {
    await api('/api/messages', { method: 'POST', body: JSON.stringify({ conversation_id: active, text }) });
    loadConvs();
    pollActive();
  } catch (e) { alert('Lỗi gửi: ' + e.message); }
  $('#send').disabled = false;
  input.focus();
}

$('#send').onclick = send;
$('#input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$('#addBtn').onclick = async () => {
  const muse_id = prompt('muse_id của account (vd: muse_001):');
  if (!muse_id) return;
  const name = prompt('Tên hiển thị:', muse_id) || muse_id;
  try {
    const r = await api('/api/conversations', { method: 'POST', body: JSON.stringify({ muse_id, name }) });
    alert(`Đã tạo ${name}.\nTOKEN của Muse này (dùng cho muse_client.py):\n\n${r.token}`);
    loadConvs();
  } catch (e) { alert('Lỗi: ' + e.message); }
};
$('#search').addEventListener('input', loadConvs);

loadConvs();
setInterval(loadConvs, 4000);
setInterval(pollActive, 2000);
</script>
</body>
</html>
